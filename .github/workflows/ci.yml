name: SignalMode CI

on:
  push:
    branches: [main, develop, "manus/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JavaScript syntax
        run: |
          echo "=== Checking JS syntax ==="
          for f in bin/install.js \
                   src/hooks/signalmode-activate.js \
                   src/hooks/signalmode-mode-tracker.js \
                   src/hooks/signalmode-config.js \
                   src/hooks/signalcrew-model-overrides.js \
                   scripts/generate-platforms.js \
                   scripts/validate-repository.js \
                   scripts/lint-prompts.js; do
            node --check "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Validate Python syntax
        run: |
          echo "=== Checking Python syntax ==="
          for f in skills/signalmode-compress/scripts/cli.py \
                   skills/signalmode-compress/scripts/compress.py \
                   skills/signalmode-compress/scripts/detect.py \
                   skills/signalmode-compress/scripts/validate.py; do
            python3 -m py_compile "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Check for brand contamination
        run: |
          echo "=== Checking for original brand identifiers ==="
          HITS=$(grep -rni "caveman\|julius\|brussee\|cavecrew\|dancing-rock\|atlas-cloud" \
            --include="*.md" --include="*.js" --include="*.py" --include="*.json" \
            --include="*.sh" --include="*.ps1" --include="*.yaml" . 2>/dev/null | wc -l)
          if [ "$HITS" -gt 0 ]; then
            echo "FAIL: Brand contamination found ($HITS hits)"
            grep -rni "caveman\|julius\|brussee\|cavecrew\|dancing-rock\|atlas-cloud" \
              --include="*.md" --include="*.js" --include="*.py" --include="*.json" \
              --include="*.sh" --include="*.ps1" --include="*.yaml" .
            exit 1
          fi
          echo "OK: Zero brand contamination"

      - name: Version consistency check
        run: |
          echo "=== Checking version consistency ==="
          PKG_VERSION=$(node -e "import('./package.json', {assert:{type:'json'}}).then(m=>console.log(m.default.version))" 2>/dev/null || node -p "require('./package.json').version" 2>/dev/null || cat package.json | grep '"version"' | head -1 | sed 's/.*: "\(.*\)".*/\1/')
          echo "package.json version: $PKG_VERSION"
          # All SKILL.md files must have a version field
          MISSING=0
          for f in skills/*/SKILL.md; do
            if ! grep -q "^version:" "$f"; then
              echo "WARN: No version field in $f"
            fi
          done
          # Rule files must have version fields
          for f in rules/*.yaml; do
            if ! grep -q "^version:" "$f"; then
              echo "FAIL: Missing version in $f"
              MISSING=1
            else
              echo "OK: $f"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then exit 1; fi

      - name: Run repository validator
        run: node scripts/validate-repository.js

      - name: Run prompt linter
        run: node scripts/lint-prompts.js

      - name: Validate SKILL.md triggers
        run: |
          echo "=== Checking SKILL.md triggers ==="
          for f in skills/*/SKILL.md; do
            if ! grep -q "^trigger:" "$f"; then
              echo "FAIL: Missing trigger in $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Check all platform files exist
        run: |
          echo "=== Checking platform files ==="
          for p in chatgpt claude claudecode codex copilot cursor gemini manus replit windsurf full-signal; do
            if [ ! -f "platforms/${p}.md" ]; then
              echo "FAIL: Missing platforms/${p}.md"
              exit 1
            fi
            echo "OK: platforms/${p}.md"
          done

      - name: Check rule files exist
        run: |
          echo "=== Checking rule files ==="
          for r in precedence integrity communication human-writing execution; do
            if [ ! -f "rules/${r}.yaml" ]; then
              echo "FAIL: Missing rules/${r}.yaml"
              exit 1
            fi
            echo "OK: rules/${r}.yaml"
          done
